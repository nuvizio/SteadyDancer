[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steadydancer"
version = "0.1.0"
description = "SteadyDancer: Harmonized and Coherent Human Image Animation with First-Frame Preservation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MCG-NJU" }]
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "opencv-python>=4.9.0.80",
    "diffusers>=0.31.0",
    "transformers>=4.49.0",
    "tokenizers>=0.20.3",
    "accelerate>=1.1.1",
    "tqdm",
    "imageio",
    "easydict",
    "ftfy",
    "dashscope",
    "imageio-ffmpeg",
    "flash_attn",
    "gradio>=5.0.0",
    "numpy>=1.23.5,<2",
    "einops",
]

[project.optional-dependencies]
pose = [
    "moviepy",
    "decord",
    "openmim",
    "mmengine",
    "mmcv==2.1.0",
    "mmdet>=3.1.0",
    "mmpose",
]
distributed = [
    "xformers==0.0.29.post1",
    "xfuser",
]

[tool.hatch.build.targets.wheel]
packages = ["wan"]

[tool.uv]
managed = true

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
